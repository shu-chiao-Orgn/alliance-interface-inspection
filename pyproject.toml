[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-bag-metrics"
version = "0.1.0"
description = "Rosbag inspection helpers with Plotly previews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "plotly>=5.18",
  "networkx>=3.0",
  "rosbags>=0.11",
]

[tool.setuptools]
packages = ["kd_bag_metrics"]

[tool.setuptools.package-dir]
kd_bag_metrics = "bag_inspection_metrics"
